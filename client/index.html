<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <!-- Title -->
    <title>
      Vita Talent - Where Integrity Meets Opportunity | Global Recruitment
      Agency
    </title>
    <!-- Description -->
    <meta
      name="description"
      content="Vita Talent connects businesses worldwide with exceptional talent from Africa, Latin America, Asia, and beyond. Empowering businesses with the right people, wherever they are."
    />
    <!-- Open Graph (social previews) -->
    <meta
      property="og:title"
      content="Vita Talent - Where Integrity Meets Opportunity"
    />
    <meta
      property="og:description"
      content="Empowering businesses worldwide with exceptional global talent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitatalent.co/" />
    <meta property="og:image" content="https://vitatalent.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vita Talent - Where Integrity Meets Opportunity"
    />
    <meta
      name="twitter:description"
      content="Empowering businesses worldwide with exceptional global talent."
    />
    <meta name="twitter:image" content="https://vitatalent.co/favicon.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Google Fonts - Optimized -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- TrustBox script -->
    <script
      type="text/javascript"
      src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async
    ></script>
    <!-- End TrustBox script -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ===== GHL Popup (minimal, shows EVERY visit) ===== -->
    <style>
      /* Bigger modal styles */
      #ghl-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 9999;
      }
      #ghl-backdrop.show {
        display: flex;
      }

      /* Increased max-width to make it feel more spacious */
      #ghl-modal {
        width: 100%;
        max-width: 960px; /* increased from 720 */
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        color: #0f172a;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
      }

      #ghl-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 5;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
        color: #374151;
      }

      /* Bigger iframe height on large screens, responsive on small screens */
      #ghl-iframe-wrap {
        width: 100%;
        height: 760px; /* larger fixed height for desktop */
        background: #fff;
      }

      @media (max-width: 1100px) {
        #ghl-modal {
          max-width: 88%;
        }
        #ghl-iframe-wrap {
          height: 72vh;
        }
      }

      @media (max-width: 760px) {
        #ghl-modal {
          width: 96%;
          border-radius: 10px;
        }
        #ghl-iframe-wrap {
          height: 88vh;
        }
      }
    </style>

    <div
      id="ghl-backdrop"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div id="ghl-modal" role="document">
        <button id="ghl-close" aria-label="Close GHL form">×</button>
        <div id="ghl-iframe-wrap">
          <!-- Your GHL iframe -->
          <iframe
            src="https://api.leadconnectorhq.com/widget/form/v7gZVJiU6138zC3pSSe8"
            style="width:100%;height:100%;border:none;border-radius:3px"
            id="inline-v7gZVJiU6138zC3pSSe8"
            data-layout="{'id':'INLINE'}"
            data-trigger-type="alwaysShow"
            data-trigger-value=""
            data-activation-type="alwaysActivated"
            data-activation-value=""
            data-deactivation-type="neverDeactivate"
            data-deactivation-value=""
            data-form-name="Pop Up Form"
            data-height="567"
            data-layout-iframe-id="inline-v7gZVJiU6138zC3pSSe8"
            data-form-id="v7gZVJiU6138zC3pSSe8"
            title="Pop Up Form"
          ></iframe>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const DELAY_MS = 5000; // 5 seconds

        function showPopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.add("show");
          b.setAttribute("aria-hidden", "false");
          // move focus into the close button for keyboard users
          const closeBtn = document.getElementById("ghl-close");
          if (closeBtn && typeof closeBtn.focus === "function") closeBtn.focus();
        }

        function hidePopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.remove("show");
          b.setAttribute("aria-hidden", "true");
          // return focus to the app root for usability
          const root = document.getElementById("root");
          if (root && typeof root.focus === "function") root.focus();
        }

        // Load GHL embed script once (idempotent)
        if (!document.querySelector('script[data-ghl-loaded]')) {
          const s = document.createElement("script");
          s.src = "https://link.msgsndr.com/js/form_embed.js";
          s.defer = true;
          s.setAttribute("data-ghl-loaded", "1");
          document.body.appendChild(s);
        }

        // Wire up handlers after DOM is ready
        document.addEventListener("DOMContentLoaded", function () {
          const backdrop = document.getElementById("ghl-backdrop");
          const closeBtn = document.getElementById("ghl-close");

          if (closeBtn) {
            closeBtn.addEventListener("click", function () {
              hidePopup();
            });
          }

          if (backdrop) {
            // close when clicking backdrop but not when clicking inside modal
            backdrop.addEventListener("click", function (e) {
              if (e.target === backdrop) {
                hidePopup();
              }
            });
          }

          // Escape key closes
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              const b = document.getElementById("ghl-backdrop");
              if (b && b.classList.contains("show")) {
                hidePopup();
              }
            }
          });

          // Show every visit after delay
          window.setTimeout(showPopup, DELAY_MS);

          // Programmatic opener
          window.openGhlPopup = function () {
            showPopup();
          };
        });
      })();
    </script>
    <!-- ===== end GHL Popup ===== -->
  </body>
</html>
