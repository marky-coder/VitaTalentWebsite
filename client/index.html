    <!-- Description -->

    />
    <!-- Open Graph (social previews) -->

    <!-- End TrustBox script -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ===== GHL Popup (minimal) =====
         This is the only thing added: styles, modal, and a small script.
         It won't interfere with your React app. Paste/replace this file in project root.
    -->
    <style>
      /* GHL popup styles */
      #ghl-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 9999;
      }
      #ghl-backdrop.show {
        display: flex;
      }
      #ghl-modal {
        width: 100%;
        max-width: 720px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        color: #0f172a;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      #ghl-close {
        position: absolute;
        top: 8px;
        right: 10px;
        z-index: 5;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
        color: #374151;
      }
      #ghl-iframe-wrap {
        width: 100%;
        height: 600px;
        background: #fff;
      }
      @media (max-width: 760px) {
        #ghl-iframe-wrap {
          height: 80vh;
        }
      }
    </style>

    <div
      id="ghl-backdrop"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div id="ghl-modal" role="document">
        <button id="ghl-close" aria-label="Close GHL form">×</button>
        <div id="ghl-iframe-wrap">
          <!-- GHL iframe (your form) -->
          <iframe
            src="https://api.leadconnectorhq.com/widget/form/v7gZVJiU6138zC3pSSe8"
            style="width:100%;height:100%;border:none;border-radius:3px"
            id="inline-v7gZVJiU6138zC3pSSe8"
            data-layout="{'id':'INLINE'}"
            data-trigger-type="alwaysShow"
            data-trigger-value=""
            data-activation-type="alwaysActivated"
            data-activation-value=""
            data-deactivation-type="neverDeactivate"
            data-deactivation-value=""
            data-form-name="Pop Up Form"
            data-height="567"
            data-layout-iframe-id="inline-v7gZVJiU6138zC3pSSe8"
            data-form-id="v7gZVJiU6138zC3pSSe8"
            title="Pop Up Form"
          ></iframe>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const DELAY_MS = 5000; // 5 seconds
        const STORAGE_KEY = "vt_ghl_popup_closed_v1";

        function isClosed() {
          try {
            return !!localStorage.getItem(STORAGE_KEY);
          } catch (e) {
            return false;
          }
        }
        function setClosed() {
          try {
            localStorage.setItem(STORAGE_KEY, "1");
          } catch (e) {}
        }

        function showPopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.add("show");
          b.setAttribute("aria-hidden", "false");
          // move focus into the modal close button for basic a11y
          const closeBtn = document.getElementById("ghl-close");
          if (closeBtn && typeof closeBtn.focus === "function") closeBtn.focus();
        }
        function hidePopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.remove("show");
          b.setAttribute("aria-hidden", "true");
          // return focus to the app root
          const root = document.getElementById("root");
          if (root && typeof root.focus === "function") root.focus();
        }

        // Close handlers (close button and backdrop)
        document.addEventListener("click", function (e) {
          const t = e.target;
          if (!t) return;
          if (t.id === "ghl-close" || (t.closest && t.closest("#ghl-close"))) {
            hidePopup();
            setClosed();
          }
          if (t.id === "ghl-backdrop") {
            hidePopup();
            setClosed();
          }
        });

        // Escape key closes
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            const b = document.getElementById("ghl-backdrop");
            if (b && b.classList.contains("show")) {
              hidePopup();
              setClosed();
            }
          }
        });

        // Load GHL embed script once (idempotent)
        if (!document.querySelector('script[data-ghl-loaded]')) {
          const s = document.createElement("script");
          s.src = "https://link.msgsndr.com/js/form_embed.js";
          s.defer = true;
          s.setAttribute("data-ghl-loaded", "1");
          document.body.appendChild(s);
        }

        // Start timer if not closed earlier
        if (!isClosed()) {
          window.setTimeout(showPopup, DELAY_MS);
        }

        // Expose programmatic opener: window.openGhlPopup()
        window.openGhlPopup = function () {
          // reset localStorage if you want to force open even if previously closed, remove the next line if not wanted
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          showPopup();
        };
      })();
    </script>
    <!-- ===== end GHL Popup ===== -->
  </body>
</html>
