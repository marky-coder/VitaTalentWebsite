<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>
      Vita Talent - Where Integrity Meets Opportunity | Global Recruitment
      Agency
    </title>
    <meta
      name="description"
      content="Vita Talent connects businesses worldwide with exceptional talent from Africa, Latin America, Asia, and beyond."
    />
    <meta property="og:title" content="Vita Talent - Where Integrity Meets Opportunity" />
    <meta property="og:description" content="Empowering businesses worldwide with exceptional global talent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitatalent.co/" />
    <meta property="og:image" content="https://vitatalent.co/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      type="text/javascript"
      src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Popup styles -->
    <style>
      #ghl-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 9999;
      }
      #ghl-backdrop.show { display:flex; }

      #ghl-modal {
        width: 100%;
        max-width: 960px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        color: #0f172a;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
      }

      #ghl-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 5;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        cursor: pointer;
        color: #374151;
      }

      .ghl-modal-header {
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
        gap:10px;
        padding:22px 28px;
        border-bottom: 1px solid rgba(15,23,42,0.06);
        background: #fff;
      }

      /* popup logo (keep at fixed display size; runtime copy will fill src/srcset) */
      .ghl-modal-header .ghl-logo {
        width:84px;
        height:auto;
        object-fit:contain;
        display:block;
      }

      .ghl-pretitle {
        margin:0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto;
        font-size:14px;
        color:#0f766e; /* a subtle green to emphasize "Looking to Hire?" */
        font-weight:600;
        letter-spacing:0.01em;
        text-transform:none;
      }

      .ghl-modal-header h2 {
        margin:0;
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto;
        font-size:22px;
        font-weight:700;
        color:#0f172a;
      }

      .ghl-subtitle {
        margin:0;
        font-size:13px;
        color:#475569;
        max-width:820px;
      }

      #ghl-iframe-wrap { width:100%; height:760px; background:#fff; padding:24px; box-sizing:border-box; }
      #ghl-iframe-wrap .ghl-iframe-inner { width:100%; height:100%; border-radius:6px; overflow:hidden; box-shadow: 0 2px 10px rgba(2,6,23,0.05); }

      @media (max-width:1100px) {
        #ghl-modal { max-width: 88%; }
        #ghl-iframe-wrap { height:72vh; }
      }
      @media (max-width:760px) {
        #ghl-modal { width:96%; border-radius:10px; }
        #ghl-iframe-wrap { height:88vh; padding:12px; }
        .ghl-modal-header { padding:14px; gap:8px; }
        .ghl-modal-header h2 { font-size:18px; }
      }
    </style>

    <div id="ghl-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
      <div id="ghl-modal" role="document">
        <button id="ghl-close" aria-label="Close GHL form">×</button>

        <div class="ghl-modal-header" role="banner" aria-hidden="false">
          <!-- Popup logo: placeholder initially; we'll copy the real header/footer logo at runtime -->
          <img id="ghl-logo" src="/favicon.png" alt="Vita Talent Logo" class="ghl-logo" width="84" height="84" />

          <!-- New content order as requested -->
          <div class="ghl-pretitle">Looking to Hire?</div>

          <h2>Book A Free Discovery Call With Us!</h2>

          <p class="ghl-subtitle">One of our Agents will answer all of your questions.</p>
        </div>

        <div id="ghl-iframe-wrap">
          <div class="ghl-iframe-inner">
            <!-- Your GHL iframe (keep your existing widget URL if needed) -->
            <iframe
              src="https://api.leadconnectorhq.com/widget/form/v7gZVJiU6138zC3pSSe8"
              style="width:100%;height:100%;border:none;border-radius:3px"
              id="inline-v7gZVJiU6138zC3pSSe8"
              title="Pop Up Form"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const DELAY_MS = 2000;

        function showPopup () {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.add("show");
          b.setAttribute("aria-hidden","false");
          const cb = document.getElementById("ghl-close");
          if (cb && typeof cb.focus === "function") cb.focus();
        }
        function hidePopup () {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.remove("show");
          b.setAttribute("aria-hidden","true");
          const root = document.getElementById("root");
          if (root && typeof root.focus === "function") root.focus();
        }

        if (!document.querySelector('script[data-ghl-loaded]')) {
          const s = document.createElement("script");
          s.src = "https://link.msgsndr.com/js/form_embed.js";
          s.defer = true;
          s.setAttribute("data-ghl-loaded","1");
          document.body.appendChild(s);
        }

        // Copy the site's header/footer logo into the popup logo so we don't use favicon.
        // It finds any <img alt="Vita Talent Logo"> the site renders and copies src and srcset.
        function copySiteLogoToPopup() {
          try {
            const siteLogo = document.querySelector('img[alt="Vita Talent Logo"]');
            const popupLogo = document.getElementById('ghl-logo');
            if (!popupLogo) return;
            if (siteLogo && siteLogo.src) {
              popupLogo.src = siteLogo.src;
              if (siteLogo.srcset) popupLogo.srcset = siteLogo.srcset;
            }
          } catch (err) {
            // silent failure
          }
        }

        document.addEventListener("DOMContentLoaded", function () {
          const backdrop = document.getElementById("ghl-backdrop");
          const closeBtn = document.getElementById("ghl-close");
          if (closeBtn) closeBtn.addEventListener("click", hidePopup);
          if (backdrop) {
            backdrop.addEventListener("click", function (e) {
              if (e.target === backdrop) hidePopup();
            });
          }
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              const b = document.getElementById("ghl-backdrop");
              if (b && b.classList.contains("show")) hidePopup();
            }
          });

          // copy logo now; also try a couple of times later because React app may hydrate after index.html runs
          copySiteLogoToPopup();
          setTimeout(copySiteLogoToPopup, 400);
          setTimeout(copySiteLogoToPopup, 1200);
          setTimeout(copySiteLogoToPopup, 3000);

          // show popup after delay
          window.setTimeout(showPopup, DELAY_MS);

          window.openGhlPopup = function () { showPopup(); };

          // best-effort attempt to style iframe's submit if same-origin (will silently fail if cross-origin)
          const iframe = document.getElementById("inline-v7gZVJiU6138zC3pSSe8");
          function tryStyleIframeSubmit() {
            if (!iframe) return;
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              if (!doc) return;
              const btn = doc.querySelector('button[type="submit"], .submit, input[type="submit"]');
              if (btn) {
                btn.style.backgroundColor = "#0ea37a";
                btn.style.color = "#fff";
                btn.style.border = "none";
                btn.style.display = "block";
                btn.style.margin = "20px auto 0";
                btn.style.padding = "10px 22px";
                btn.style.borderRadius = "6px";
                btn.style.fontWeight = "700";
              }
            } catch (e) {
              // cross-origin or other error — ignore
            }
          }
          if (iframe) {
            iframe.addEventListener("load", function () {
              tryStyleIframeSubmit();
              setTimeout(tryStyleIframeSubmit, 400);
              setTimeout(tryStyleIframeSubmit, 800);
            });
          }
        });
      })();
    </script>
  </body>
</html>
