<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <!-- Title -->
    <title>
      Vita Talent - Where Integrity Meets Opportunity | Global Recruitment
      Agency
    </title>
    <!-- Description -->
    <meta
      name="description"
      content="Vita Talent connects businesses worldwide with exceptional talent from Africa, Latin America, Asia, and beyond. Empowering businesses with the right people, wherever they are."
    />
    <!-- Open Graph (social previews) -->
    <meta
      property="og:title"
      content="Vita Talent - Where Integrity Meets Opportunity"
    />
    <meta
      property="og:description"
      content="Empowering businesses worldwide with exceptional global talent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitatalent.co/" />
    <meta property="og:image" content="https://vitatalent.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vita Talent - Where Integrity Meets Opportunity"
    />
    <meta
      name="twitter:description"
      content="Empowering businesses worldwide with exceptional global talent."
    />
    <meta name="twitter:image" content="https://vitatalent.co/favicon.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Google Fonts - Optimized -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- TrustBox script -->
    <script
      type="text/javascript"
      src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async
    ></script>
    <!-- End TrustBox script -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ===== GHL Popup (minimal, shows EVERY visit) ===== -->
    <style>
      /* Bigger modal styles */
      #ghl-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 9999;
      }
      #ghl-backdrop.show {
        display: flex;
      }

      /* Increased max-width to make it feel more spacious */
      #ghl-modal {
        width: 100%;
        max-width: 960px; /* increased from 720 */
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        color: #0f172a;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
      }

      #ghl-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 5;
        background: transparent;
        border: none;
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
        color: #374151;
      }

      /* Header inside modal */
      .ghl-modal-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
        padding: 20px 28px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        background: #ffffff;
      }
      .ghl-modal-header .ghl-logo {
        width: 84px;
        height: auto;
        object-fit: contain;
        display: block;
      }
      .ghl-modal-header h2 {
        margin: 0;
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
      }
      .ghl-modal-header p {
        margin: 0;
        font-size: 13px;
        color: #475569;
      }

      /* Bigger iframe height on large screens, responsive on small screens */
      #ghl-iframe-wrap {
        width: 100%;
        height: 760px; /* larger fixed height for desktop */
        background: #fff;
        padding: 24px;
        box-sizing: border-box;
      }

      /* make iframe area visually separated and centered */
      #ghl-iframe-wrap .ghl-iframe-inner {
        width: 100%;
        height: 100%;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(2, 6, 23, 0.05);
      }

      @media (max-width: 1100px) {
        #ghl-modal {
          max-width: 88%;
        }
        #ghl-iframe-wrap {
          height: 72vh;
        }
      }

      @media (max-width: 760px) {
        #ghl-modal {
          width: 96%;
          border-radius: 10px;
        }
        #ghl-iframe-wrap {
          height: 88vh;
          padding: 12px;
        }
        .ghl-modal-header {
          padding: 14px;
        }
      }
    </style>

    <div
      id="ghl-backdrop"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div id="ghl-modal" role="document">
        <button id="ghl-close" aria-label="Close GHL form">×</button>

        <!-- Header: Logo > Title > small subtitle -->
        <div class="ghl-modal-header" role="banner" aria-hidden="false">
          <!-- REPLACE the src value below with your real logo path (see note) -->
          <img src="/favicon.png" alt="Vita Talent Logo" class="ghl-logo" />
          <h2>Book A Free Discovery Call With Us!</h2>
          <p>Tell us a little about yourself — questions are shown below</p>
        </div>

        <div id="ghl-iframe-wrap">
          <div class="ghl-iframe-inner">
            <!-- Your GHL iframe -->
            <iframe
              src="https://api.leadconnectorhq.com/widget/form/v7gZVJiU6138zC3pSSe8"
              style="width:100%;height:100%;border:none;border-radius:3px"
              id="inline-v7gZVJiU6138zC3pSSe8"
              data-layout="{'id':'INLINE'}"
              data-trigger-type="alwaysShow"
              data-trigger-value=""
              data-activation-type="alwaysActivated"
              data-activation-value=""
              data-deactivation-type="neverDeactivate"
              data-deactivation-value=""
              data-form-name="Pop Up Form"
              data-height="567"
              data-layout-iframe-id="inline-v7gZVJiU6138zC3pSSe8"
              data-form-id="v7gZVJiU6138zC3pSSe8"
              title="Pop Up Form"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const DELAY_MS = 5000; // 5 seconds

        function showPopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.add("show");
          b.setAttribute("aria-hidden", "false");
          // move focus into the close button for keyboard users
          const closeBtn = document.getElementById("ghl-close");
          if (closeBtn && typeof closeBtn.focus === "function") closeBtn.focus();
        }

        function hidePopup() {
          const b = document.getElementById("ghl-backdrop");
          if (!b) return;
          b.classList.remove("show");
          b.setAttribute("aria-hidden", "true");
          // return focus to the app root for usability
          const root = document.getElementById("root");
          if (root && typeof root.focus === "function") root.focus();
        }

        // Load GHL embed script once (idempotent)
        if (!document.querySelector('script[data-ghl-loaded]')) {
          const s = document.createElement("script");
          s.src = "https://link.msgsndr.com/js/form_embed.js";
          s.defer = true;
          s.setAttribute("data-ghl-loaded", "1");
          document.body.appendChild(s);
        }

        // Wire up handlers after DOM is ready
        document.addEventListener("DOMContentLoaded", function () {
          const backdrop = document.getElementById("ghl-backdrop");
          const closeBtn = document.getElementById("ghl-close");

          if (closeBtn) {
            closeBtn.addEventListener("click", function () {
              hidePopup();
            });
          }

          if (backdrop) {
            // close when clicking backdrop but not when clicking inside modal
            backdrop.addEventListener("click", function (e) {
              if (e.target === backdrop) {
                hidePopup();
              }
            });
          }

          // Escape key closes
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              const b = document.getElementById("ghl-backdrop");
              if (b && b.classList.contains("show")) {
                hidePopup();
              }
            }
          });

          // Show every visit after delay
          window.setTimeout(showPopup, DELAY_MS);

          // Programmatic opener
          window.openGhlPopup = function () {
            showPopup();
          };

          // Attempt to re-style the iframe submit button (best effort).
          // IMPORTANT: most LeadConnector embeds are cross-origin, so this will usually throw.
          // We try gracefully and fall back if it fails.
          const iframe = document.getElementById("inline-v7gZVJiU6138zC3pSSe8");
          function tryStyleIframeSubmit() {
            if (!iframe) return;
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              if (!doc) return;
              // Example: find the main submit button and update color / center it
              const btn = doc.querySelector('button[type="submit"], .submit, input[type="submit"]');
              if (btn) {
                // Apply green similar to site primary (adjust as needed)
                btn.style.backgroundColor = "#0ea37a"; /* site primary green-ish */
                btn.style.color = "#fff";
                btn.style.border = "none";
                btn.style.display = "block";
                btn.style.margin = "20px auto 0";
                btn.style.padding = "10px 22px";
                btn.style.borderRadius = "6px";
                btn.style.fontWeight = "700";
              }
            } catch (err) {
              // Cross-origin, can't touch iframe contents — that's normal.
              // Nothing to do here. Console for debugging.
              // console.info('Cannot style GHL iframe due to cross-origin policy.');
            }
          }

          // Try after iframe load and a couple of later ticks (best-effort)
          if (iframe) {
            iframe.addEventListener("load", function () {
              tryStyleIframeSubmit();
              // some embeds load inner content after a moment
              setTimeout(tryStyleIframeSubmit, 400);
              setTimeout(tryStyleIframeSubmit, 800);
            });
          }
        });
      })();
    </script>
    <!-- ===== end GHL Popup ===== -->
  </body>
</html>
