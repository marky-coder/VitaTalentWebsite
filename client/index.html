    <!-- Google Fonts - Optimized -->

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Social icons (non-invasive overlay) -->
    <style>
      /* Non-invasive socials overlay — fixed so it does not affect layout */
      .vt-socials-top {
        position: fixed;
        top: 12px;
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 9999;
        pointer-events: auto;
      }

      .vt-socials-bottom {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 9999;
        pointer-events: auto;
      }

      .vt-socials-top a,
      .vt-socials-bottom a {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: #0f172a;
        background: rgba(15, 23, 42, 0.04);
        text-decoration: none;
        transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
      }

      .vt-socials-top a:hover,
      .vt-socials-bottom a:hover {
        transform: translateY(-2px);
        background: rgba(79, 70, 229, 0.08);
        opacity: 1;
      }

      .vt-socials-top svg,
      .vt-socials-bottom svg {
        width: 14px;
        height: 14px;
        display: block;
        fill: currentColor;
      }

      /* Don't show overlays if extremely small screens or if you prefer removal */
      @media (max-width: 420px) {
        .vt-socials-top,
        .vt-socials-bottom {
          display: none;
        }
      }
    </style>

    <!-- TrustBox script -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
    <!-- End TrustBox script -->
  </head>
